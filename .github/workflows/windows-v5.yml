name: Publish TerraFrames 5

on:
  push:
    paths:
      - '.github/workflows/windows-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Test and publish the Windows portable build
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest test_processing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --onedir --windowed --noupx --name TerraFrames --collect-all rasterio desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = 'dist/TerraFrames'
          python make_demo.py "$app/demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md "$app/README.md"
          $notices = New-Item "$app/ThirdPartyNotices" -ItemType Directory
          $pythonHome = python -c "import sys; print(sys.base_prefix)"
          Copy-Item "$pythonHome/LICENSE.txt" $notices.FullName
          Get-ChildItem "$pythonHome/tcl" -Filter license.terms -Recurse | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $notices.FullName ($_.Directory.Name + '-license.terms'))
          }
          $sitePackages = python -c "import sysconfig; print(sysconfig.get_path('purelib'))"
          Get-ChildItem $sitePackages -Directory -Filter '*.dist-info' | ForEach-Object {
            $licenseFiles = Get-ChildItem $_.FullName | Where-Object Name -match 'license|notice|copying'
            if ($licenseFiles) {
              $destination = New-Item (Join-Path $notices.FullName $_.Name) -ItemType Directory
              $licenseFiles | Copy-Item -Destination $destination.FullName -Recurse
            }
          }
          $zip = 'terraframes-v5.0.0-windows-x64.zip'
          Compress-Archive -Path $app -DestinationPath $zip
          python -m zipfile -t $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($generation in 1..4) {
            $tag = "v$generation.0.0"
            $record = git log --format='%H' -1 --grep="^TerraFrames generation ${generation}:"
            if (!$record) { throw "Missing generation $generation commit" }
            $existing = git tag --list $tag
            if ($existing) {
              if ((git rev-list -n 1 $tag) -ne $record) { throw "$tag already points to another commit" }
            } else {
              git tag $tag $record
              git push origin "refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          gh release create v5.0.0 $zip --target $env:GITHUB_SHA --title '巨量遥感影像批量处理系统 5.0.0' --notes 'Parallel and resumable GeoTIFF inventory, alignment and monthly composites, with a Windows workspace and synthetic sample imagery.'
          exit $LASTEXITCODE
